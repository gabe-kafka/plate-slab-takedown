# Deploys the web app (web/) to the production Vercel project on every push
# to main, and on demand from the Actions tab.
#
# One-time setup, in this repository's Settings > Secrets and variables >
# Actions, add three repository secrets from your Vercel account:
#   VERCEL_TOKEN       Vercel > Account Settings > Tokens > Create
#   VERCEL_ORG_ID      Vercel > Team/Account Settings > General > ID
#   VERCEL_PROJECT_ID  Vercel > the project > Settings > General > Project ID
# (or run `npx vercel link` inside web/ once and read both IDs from
# web/.vercel/project.json).
#
# If you later connect the repository in the Vercel dashboard instead
# (project > Settings > Git), delete this file so main is not deployed twice.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.VERCEL_DEPLOY_DISABLED != 'true' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check secrets are present
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. See .github/workflows/deploy-vercel.yml for where to get them."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull project settings
        working-directory: web
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to production
        working-directory: web
        run: |
          url=$(vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Deployed: $url"
          echo "### Deployed to Vercel" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
